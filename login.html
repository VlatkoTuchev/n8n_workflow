<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/auth.css" />
  <script src="/auth-bg.js" defer></script>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to continue to your AI companion.</p>
    <input id="l_email" placeholder="Email" />
    <input id="l_pwd" type="password" placeholder="Password" />
    <button onclick="login()">Sign in</button>
    <p class="muted center">Don't have an account? <a href="/signup">Create one</a></p>
    <div id="msg"></div>
  </div>
<script>
async function login() {
  const body = { email: v('l_email'), password: v('l_pwd') };
  await call('/auth/login', body);
}
function v(id){ return document.getElementById(id).value.trim(); }
async function call(path, body) {
  m('Working...');
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) return m('Error: ' + (j.error || r.status));
  m('Success! Redirecting...');
  setTimeout(()=> location.href='/', 600);
}
function m(t){ document.getElementById('msg').textContent = t; }
</script>
</body>
</html>
